[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-prune"
version = "0.3.0"
description = "φ-pruning: adjacency-constrained structured sparsity for neural networks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
export = ["onnx>=1.14", "onnxruntime>=1.15"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
phi-prune = "phi_prune.cli:main"
phi-model = "phi_model:main"

[tool.setuptools.packages.find]
include = ["phi_prune*", "phi_store*", "phi_rank*", "phi_serve*", "phi_model*"]
