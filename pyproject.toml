[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-prune"
version = "0.3.0"
description = "φ-pruning under the (1,∞)-RLL constraint, Fibonacci coding of quantized weights, and the ranking models the p4 plugins train in a project's store"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
export = ["onnx>=1.14", "onnxruntime>=1.15"]
dev = ["pytest>=7.0"]

[project.scripts]
phi-prune = "phi_prune.cli:main"

[tool.setuptools.packages.find]
include = ["phi_prune*", "phi_store*", "phi_rank*", "phi_serve*", "phi_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--durations=0 --durations-min=0 -ra"
# The seconds a whole run may take on this machine; tests/test_suite.py fails a run that takes longer, except in CI.
budget_seconds = "60"
