name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these jobs before it tags a version.
  workflow_call:

# pyproject.toml, the packages and the tests are in phi/.
defaults:
  run:
    working-directory: phi

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pyproject.toml's floors: the oldest Python, torch and numpy it admits.
          - python-version: "3.11"
            torch: "torch==2.4.1"
            numpy: "numpy==1.24.0"
          # The newest Python, with the newest torch and numpy.
          - python-version: "3.15"
            torch: "torch"
            numpy: "numpy"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install torch from its CPU wheels, then phi
        run: |
          pip install "${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" "${{ matrix.numpy }}"
      - run: python -m pytest

  # export_onnx with the packages the export extra installs, on the newest torch and the newest Python onnxruntime has wheels for; the test may not skip.
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install torch from its CPU wheels, then phi with its export extra
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,export]"
      - name: Run the export test, failing on a skip
        run: |
          set -o pipefail
          python -m pytest -rs tests/test_export_onnx.py | tee export.log
          ! grep -q skipped export.log
