name: release

# A push to main whose lbiza/pyproject.toml names a version that has no tag yet is released: the tests run, the sdist
# and the wheel are built from lbiza/, an image with the wheel installed is pushed to ghcr.io/ezexe/phi, the commit is
# tagged v<version>, and a GitHub release of that tag holds both files. A push that leaves the version as it is
# releases nothing. To release, raise version in lbiza/pyproject.toml, in lbiza/phi_prune/__init__.py and in
# CITATION.cff, which tests/test_packaging.py holds equal.
#
# The image is the repository's package, ghcr.io/ezexe/phi:<version> and :latest, built by lbiza/Dockerfile. It is
# pushed before the tag is made, so a release whose image fails to build or to run leaves no tag behind.
#
# The pypi job uploads the same two files to PyPI as the project phi-prune, by trusted publishing, with no token kept
# here. It runs once the repository variable PYPI_PUBLISH is true, and needs a trusted publisher on PyPI for the
# project phi-prune that names the owner ezexe, the repository phi, the workflow release.yml and the environment pypi.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and a release that has begun is never cancelled by a later push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      new: ${{ steps.read.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: Read the version of lbiza/pyproject.toml and look for its tag
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('lbiza/pyproject.toml', 'rb'))['project']['version'])")
          tag="v$version"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then new=false; else new=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "$tag, new: $new" >> "$GITHUB_STEP_SUMMARY"

  tests:
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: ./.github/workflows/tests.yml

  build:
    needs: [version, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build the sdist and the wheel from lbiza/
        run: |
          pip install build twine
          python -m build lbiza --outdir dist
          twine check --strict dist/*
      - name: Fail unless both files carry the version that is being tagged
        run: |
          ls dist
          test -f "dist/phi_prune-${{ needs.version.outputs.version }}.tar.gz"
          test -f "dist/phi_prune-${{ needs.version.outputs.version }}-py3-none-any.whl"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  image:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Build the image from the wheel
        run: docker build -f lbiza/Dockerfile -t "$IMAGE:$VERSION" -t "$IMAGE:latest" dist
      - name: Fail unless the image runs phi-prune and imports the four packages at this version
        run: |
          docker run --rm "$IMAGE:$VERSION" --help
          docker run --rm --entrypoint python "$IMAGE:$VERSION" -c "import phi_prune, phi_store, phi_rank, phi_model; assert phi_prune.__version__ == '$VERSION', phi_prune.__version__"
      - name: Push the image to ghcr.io
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

  github-release:
    needs: [version, build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Tag the commit and release the two files
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ needs.version.outputs.tag }}" dist/*
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "phi-prune ${{ needs.version.outputs.version }}"
          --generate-notes

  pypi:
    needs: [version, build, github-release]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/phi-prune/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
